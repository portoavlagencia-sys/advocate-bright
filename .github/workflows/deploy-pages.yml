name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare Pages artifact
        run: |
          echo "--- tree ---"
          ls -la | head -30
          for d in .output/public dist dist/client dist/public; do echo "--- $d ---"; ls "$d" 2>/dev/null | head -30 || echo "missing $d"; done
          OUT=""
          for d in .output/public dist/client dist dist/public; do
            if [ -f "$d/index.html" ]; then OUT="$d"; break; fi
          done
          if [ -z "$OUT" ]; then echo "ERRO: nenhum index.html encontrado"; find .output dist -maxdepth 3 2>/dev/null | head -50; exit 1; fi
          echo "Usando OUT=$OUT"
          echo "OUT=$OUT" >> $GITHUB_ENV
          if [ ! -f "$OUT/404.html" ]; then cp "$OUT/index.html" "$OUT/404.html"; fi
          touch "$OUT/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
