name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare Pages artifact
        run: |
          echo "--- dist ---"; ls dist 2>/dev/null | head -20 || echo "no dist"
          echo "--- .output/public ---"; ls .output/public 2>/dev/null | head -20 || echo "no .output/public"
          if [ -d .output/public ]; then OUT=.output/public; else OUT=dist; fi
          echo "OUT=$OUT" >> $GITHUB_ENV
          if [ -f "$OUT/index.html" ] && [ ! -f "$OUT/404.html" ]; then cp "$OUT/index.html" "$OUT/404.html"; fi
          touch "$OUT/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
